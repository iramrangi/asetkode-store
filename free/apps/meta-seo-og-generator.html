<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Meta, Open Graph &amp; JSON-LD Schema Generator — Ddev Studio (MIT)</title>
  <!-- MIT License | Copyright (c) 2026 Ddev Studio (https://asetkode-store.pages.dev/free/) -->
  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { background:#f8fafc; color:#0f172a; min-height:100vh; padding:20px; }
    .wrap { max-width:1080px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid #e2e8f0; }
    .badge { display:inline-block; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:20px; }
    .field { margin-bottom:12px; }
    label { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#475569; margin-bottom:5px; }
    input, textarea, select { width:100%; padding:9px 12px; border:1px solid #cbd5e1; border-radius:10px; font-size:13.5px; }
    textarea { min-height:76px; resize:vertical; }
    .serp { border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:14px; background:#fff; }
    .serp-url { font-size:12px; color:#15803d; margin-bottom:3px; word-break:break-all; }
    .serp-title { font-size:18px; color:#1d4ed8; font-weight:600; line-height:1.3; margin-bottom:4px; }
    .serp-desc { font-size:13px; color:#475569; line-height:1.5; }
    pre { background:#0b1020; color:#e2e8f0; padding:14px; border-radius:12px; font-family:ui-monospace,Consolas,monospace; font-size:12px; line-height:1.55; overflow-x:auto; max-height:360px; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; }
    .btn-primary { background:#4f46e5; border-color:#4f46e5; color:#fff; }
    .msg { font-size:12.5px; font-weight:700; color:#059669; margin-top:8px; min-height:18px; }
    @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="badge">MIT Open Source &bull; Free</span>
        <h1 style="font-size:20px;margin-top:6px;" id="tHeading">SEO Meta Tags, Open Graph &amp; JSON-LD Generator</h1>
      </div>
      <a class="btn" href="../" id="tBack">Kembali ke Halaman Gratis</a>
    </div>

    <div class="grid">
      <div class="card">
        <div class="field">
          <label><span id="lTitle">Judul Halaman (&le; 60 karakter)</span><span id="cTitle">0 / 60</span></label>
          <input id="inTitle" value="Ddev Studio — Source Code &amp; Aplikasi Web Siap Pakai" />
        </div>
        <div class="field">
          <label><span id="lDesc">Meta Description (&le; 160 karakter)</span><span id="cDesc">0 / 160</span></label>
          <textarea id="inDesc">Katalog aplikasi kasir POS, website agen travel, &amp; tema Blogger XML lengkap dengan Live Demo browser langsung.</textarea>
        </div>
        <div class="field">
          <label><span id="lUrl">Canonical URL</span></label>
          <input id="inUrl" value="https://asetkode-store.pages.dev/" />
        </div>
        <div class="field">
          <label><span id="lImg">Open Graph Image URL (1200x630)</span></label>
          <input id="inImg" value="https://asetkode-store.pages.dev/demo/travel/screenshot.png" />
        </div>
        <div class="field">
          <label><span id="lType">Tipe Schema JSON-LD</span></label>
          <select id="inType">
            <option value="WebSite">WebSite</option>
            <option value="SoftwareApplication">SoftwareApplication</option>
            <option value="Article">Article</option>
          </select>
        </div>
      </div>

      <div class="card">
        <label style="margin-bottom:8px;" id="lSerp">Pratinjau Google Search</label>
        <div class="serp">
          <div class="serp-url" id="pvUrl">https://asetkode-store.pages.dev/</div>
          <div class="serp-title" id="pvTitle">Title Preview</div>
          <div class="serp-desc" id="pvDesc">Description preview</div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <label style="margin:0;" id="lCode">Kode HTML Siap Tempel di &lt;head&gt;</label>
          <button type="button" class="btn btn-primary" id="btnCopy">Salin Tag &lt;head&gt;</button>
        </div>
        <pre id="codeOut"></pre>
        <div class="msg" id="statusMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const IS_EN = new URLSearchParams(location.search).get('lang') === 'en';
    if (IS_EN) {
      document.documentElement.lang = 'en';
      document.getElementById('tBack').textContent = 'Back to Free Tools';
      document.getElementById('tBack').href = '../?lang=en';
      document.getElementById('lTitle').textContent = 'Page Title (<= 60 chars)';
      document.getElementById('lDesc').textContent = 'Meta Description (<= 160 chars)';
      document.getElementById('lType').textContent = 'JSON-LD Schema Type';
      document.getElementById('lSerp').textContent = 'Google Search SERP Preview';
      document.getElementById('lCode').textContent = 'Ready-to-Paste <head> HTML';
      document.getElementById('btnCopy').textContent = 'Copy <head> Tags';
    }
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function render() {
      const title = document.getElementById('inTitle').value.trim();
      const desc = document.getElementById('inDesc').value.trim();
      const url = document.getElementById('inUrl').value.trim();
      const img = document.getElementById('inImg').value.trim();
      const schemaType = document.getElementById('inType').value;

      document.getElementById('cTitle').textContent = title.length + ' / 60';
      document.getElementById('cTitle').style.color = title.length > 60 ? '#dc2626' : '#059669';
      document.getElementById('cDesc').textContent = desc.length + ' / 160';
      document.getElementById('cDesc').style.color = desc.length > 160 ? '#dc2626' : '#059669';

      document.getElementById('pvUrl').textContent = url || 'https://example.com/';
      document.getElementById('pvTitle').textContent = title.slice(0, 65) || 'Untitled Page';
      document.getElementById('pvDesc').textContent = desc.slice(0, 165) || 'Meta description preview...';

      const jsonLd = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': schemaType,
        name: title,
        description: desc,
        url: url
      }, null, 2);

      const snippet = [
        `<title>${esc(title)}</title>`,
        `<meta name="description" content="${esc(desc)}" />`,
        `<link rel="canonical" href="${esc(url)}" />`,
        `<meta property="og:type" content="website" />`,
        `<meta property="og:url" content="${esc(url)}" />`,
        `<meta property="og:title" content="${esc(title)}" />`,
        `<meta property="og:description" content="${esc(desc)}" />`,
        img ? `<meta property="og:image" content="${esc(img)}" />` : '',
        `<meta name="twitter:card" content="summary_large_image" />`,
        `<script type="application/ld+json">\n${jsonLd}\n<\/script>`
      ].filter(Boolean).join('\n');

      document.getElementById('codeOut').textContent = snippet;
    }
    ['inTitle', 'inDesc', 'inUrl', 'inImg', 'inType'].forEach((id) => {
      document.getElementById(id).addEventListener('input', render);
    });
    document.getElementById('btnCopy').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('codeOut').textContent).then(() => {
        document.getElementById('statusMsg').textContent = IS_EN ? 'SEO & Schema tags copied!' : 'Tag SEO & JSON-LD tersalin!';
      });
    });
    render();
  </script>
</body>
</html>
