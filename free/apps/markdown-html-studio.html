<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Live Editor &amp; HTML Exporter — Ddev Studio Open Source (MIT)</title>

  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { background:#f8fafc; color:#0f172a; min-height:100vh; padding:20px; }
    .wrap { max-width:1120px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #e2e8f0; }
    .badge { display:inline-block; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .pane { background:#fff; border:1px solid #cbd5e1; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-height:480px; }
    .pane-head { padding:10px 14px; background:#f1f5f9; border-bottom:1px solid #e2e8f0; font-size:12px; font-weight:700; color:#475569; display:flex; justify-content:space-between; }
    textarea { flex:1; border:none; padding:16px; font-family:ui-monospace,Consolas,monospace; font-size:13.5px; line-height:1.65; resize:none; outline:none; color:#0f172a; }
    .preview { flex:1; padding:18px 22px; overflow-y:auto; line-height:1.7; font-size:15px; }
    .preview h1, .preview h2, .preview h3 { margin:14px 0 8px; line-height:1.3; }
    .preview p { margin-bottom:10px; }
    .preview ul { margin:8px 0 12px 22px; }
    .preview blockquote { border-left:4px solid #4f46e5; padding:8px 14px; background:#eef2ff; margin:10px 0; color:#312e81; }
    .preview pre { background:#0b1020; color:#e2e8f0; padding:12px; border-radius:8px; overflow-x:auto; margin:10px 0; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
    .preview code { background:#f1f5f9; padding:2px 5px; border-radius:4px; font-family:ui-monospace,Consolas,monospace; font-size:0.9em; }
    .preview pre code { background:none; padding:0; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:9px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; font-weight:700; font-size:12.5px; cursor:pointer; text-decoration:none; }
    .btn-primary { background:#4f46e5; border-color:#4f46e5; color:#fff; }
    @media (max-width:860px) { .grid { grid-template-columns:1fr; } .pane { min-height:340px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="badge">MIT Open Source &bull; Safe Sanitized Renderer</span>
        <h1 style="font-size:20px;margin-top:6px;">Markdown Studio &amp; HTML Exporter</h1>
      </div>
      <a class="btn" href="../" id="tBack">Kembali ke Halaman Gratis</a>
    </div>

    <div class="toolbar">
      <div style="font-size:13px;font-weight:700;color:#475569;" id="statsBar">0 kata &bull; 0 karakter</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn btn-primary" id="btnCopyHtml">Salin HTML</button>
        <button type="button" class="btn" id="btnDlHtml">Unduh .HTML</button>
        <button type="button" class="btn" id="btnDlMd">Unduh .MD</button>
      </div>
    </div>

    <div class="grid">
      <div class="pane">
        <div class="pane-head"><span>Markdown Input</span><span id="statusMsg" style="color:#059669;"></span></div>
        <textarea id="mdIn"># Dokumentasi Cepat Proyek

Tulis **README**, catatan teknis, atau artikel blog Anda langsung di editor ini.

> Catatan: Seluruh parsing berjalan 100% lokal di browser tanpa mengirim teks ke server mana pun.

## Fitur Utama
- Mendukung Heading (`#`, `##`, `###`)
- Teks **tebal**, *miring*, dan `inline code`
- Blok kode dan tautan [Ddev Studio](https://asetkode-store.pages.dev/)

```js
function greet(name) {
  return 'Halo, ' + name + '!';
}
```</textarea>
      </div>

      <div class="pane">
        <div class="pane-head"><span>Live HTML Preview</span><span>XSS-Safe</span></div>
        <div class="preview" id="htmlOut"></div>
      </div>
    </div>
  </div>

  <script>
    const IS_EN = new URLSearchParams(location.search).get('lang') === 'en';
    if (IS_EN) {
      document.documentElement.lang = 'en';
      document.getElementById('tBack').textContent = 'Back to Free Tools';
      document.getElementById('tBack').href = '../?lang=en';
      document.getElementById('btnCopyHtml').textContent = 'Copy HTML';
      document.getElementById('btnDlHtml').textContent = 'Download .HTML';
      document.getElementById('btnDlMd').textContent = 'Download .MD';
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function safeHref(url) {
      return /^https?:\/\//i.test(url.trim()) ? esc(url.trim()) : '#';
    }
    function inlineFmt(str) {
      let s = esc(str);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => `<a href="${safeHref(href)}" target="_blank" rel="noopener">${label}</a>`);
      return s;
    }
    function mdToHtml(src) {
      const lines = String(src || '').split(/\r?\n/);
      const out = [];
      let inCode = false, codeBuf = [], inList = false;

      const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
      lines.forEach((line) => {
        if (/^```/.test(line.trim())) {
          closeList();
          if (!inCode) { inCode = true; codeBuf = []; }
          else { inCode = false; out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`); }
          return;
        }
        if (inCode) { codeBuf.push(line); return; }
        if (!line.trim()) { closeList(); return; }
        if (/^###\s+/.test(line)) { closeList(); out.push(`<h3>${inlineFmt(line.replace(/^###\s+/, ''))}</h3>`); return; }
        if (/^##\s+/.test(line)) { closeList(); out.push(`<h2>${inlineFmt(line.replace(/^##\s+/, ''))}</h2>`); return; }
        if (/^#\s+/.test(line)) { closeList(); out.push(`<h1>${inlineFmt(line.replace(/^#\s+/, ''))}</h1>`); return; }
        if (/^>\s?/.test(line)) { closeList(); out.push(`<blockquote>${inlineFmt(line.replace(/^>\s?/, ''))}</blockquote>`); return; }
        if (/^[-*]\s+/.test(line)) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${inlineFmt(line.replace(/^[-*]\s+/, ''))}</li>`);
          return;
        }
        closeList();
        out.push(`<p>${inlineFmt(line)}</p>`);
      });
      closeList();
      if (inCode) out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`);
      return out.join('\n');
    }

    let latestHtml = '';
    function render() {
      const raw = document.getElementById('mdIn').value;
      latestHtml = mdToHtml(raw);
      document.getElementById('htmlOut').innerHTML = latestHtml;
      const words = raw.trim() ? raw.trim().split(/\s+/).length : 0;
      document.getElementById('statsBar').textContent = IS_EN
        ? `${words} words • ${raw.length} chars`
        : `${words} kata • ${raw.length} karakter`;
    }

    function downloadFile(name, content, mime) {
      const b = new Blob([content], { type: mime });
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u; a.download = name; a.click();
      URL.revokeObjectURL(u);
    }

    document.getElementById('mdIn').addEventListener('input', render);
    document.getElementById('btnCopyHtml').addEventListener('click', () => {
      navigator.clipboard.writeText(latestHtml).then(() => {
        document.getElementById('statusMsg').textContent = IS_EN ? 'HTML copied!' : 'HTML tersalin!';
      });
    });
    document.getElementById('btnDlHtml').addEventListener('click', () => {
      downloadFile('document.html', `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{max-width:760px;margin:40px auto;font-family:system-ui,sans-serif;line-height:1.7;padding:0 20px;color:#0f172a}pre{background:#0f172a;color:#f8fafc;padding:14px;border-radius:8px;overflow:auto}</style></head><body>${latestHtml}</body></html>`, 'text/html');
    });
    document.getElementById('btnDlMd').addEventListener('click', () => {
      downloadFile('README.md', document.getElementById('mdIn').value, 'text/markdown');
    });
    render();
  </script>
</body>
</html>
