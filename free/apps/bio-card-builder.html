<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioCard &amp; vCard Builder — Ddev Studio Open Source (MIT)</title>
  <!-- MIT License | Copyright (c) 2026 Ddev Studio (https://asetkode-store.pages.dev/free/) -->
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --accent:#4f46e5; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
    .wrap { max-width:1060px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .badge { display:inline-flex; align-items:center; gap:6px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1.1fr 0.9fr; gap:20px; align-items:start; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; }
    .field { margin-bottom:12px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; }
    input, textarea, select { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; background:#fff; color:var(--text); }
    textarea { min-height:68px; resize:vertical; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 15px; border-radius:10px; border:1px solid var(--border); background:#fff; color:var(--text); font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-dark { background:#0f172a; color:#fff; border-color:#0f172a; }
    .phone { max-width:340px; margin:0 auto; background:#0f172a; border-radius:28px; padding:14px; box-shadow:0 20px 45px rgba(15,23,42,0.18); }
    .screen { background:#ffffff; border-radius:20px; padding:24px 18px; min-height:430px; text-align:center; }
    .avatar { width:72px; height:72px; border-radius:22px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:24px; }
    .p-name { font-size:18px; font-weight:800; }
    .p-role { font-size:13px; color:#475569; margin-top:2px; font-weight:600; }
    .p-bio { font-size:12.5px; color:#64748b; margin:10px 0 16px; line-height:1.5; }
    .p-links { display:grid; gap:9px; text-align:left; }
    .p-link { display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-radius:12px; background:#f8fafc; border:1px solid #e2e8f0; font-size:13px; font-weight:700; color:#0f172a; text-decoration:none; }
    .status { margin-top:10px; font-size:12.5px; font-weight:700; color:#059669; min-height:18px; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="badge">MIT Open Source &bull; Free</span>
        <h1 style="font-size:20px; margin-top:6px;" id="tHeading">BioCard &amp; vCard (.vcf) Generator</h1>
      </div>
      <a class="btn" href="../" id="tBack">Kembali ke Halaman Gratis</a>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="row2">
          <div class="field">
            <label id="lName">Nama Lengkap / Brand</label>
            <input id="inName" value="Ddev Studio" />
          </div>
          <div class="field">
            <label id="lRole">Profesi / Tagline</label>
            <input id="inRole" value="Web Developer &amp; Digital Creator" />
          </div>
        </div>
        <div class="field">
          <label id="lBio">Bio Singkat</label>
          <textarea id="inBio">Membangun aplikasi web praktis, sistem POS UMKM, dan source code siap pakai.</textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label>Email</label>
            <input id="inEmail" value="dekamayooo@gmail.com" />
          </div>
          <div class="field">
            <label id="lColor">Warna Aksen</label>
            <input id="inColor" type="color" value="#4f46e5" style="height:40px;padding:4px;" />
          </div>
        </div>
        <div class="field">
          <label id="lLinks">Daftar Link (Format: Label | URL per baris)</label>
          <textarea id="inLinks" style="min-height:92px;">Katalog Aplikasi Web | https://asetkode-store.pages.dev/
Live Demo Travel App | https://asetkode-store.pages.dev/demo/travel/
Instagram Resmi | https://instagram.com/iramrangi_dev</textarea>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btnVcf">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="tBtnVcf">Unduh Kontak (.vcf)</span>
          </button>
          <button type="button" class="btn btn-dark" id="btnHtml">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span id="tBtnHtml">Ekspor Halaman Bio (.html)</span>
          </button>
        </div>
        <div class="status" id="statusMsg"></div>
      </div>

      <div class="phone">
        <div class="screen">
          <div class="avatar" id="pvAvatar">DS</div>
          <div class="p-name" id="pvName">Ddev Studio</div>
          <div class="p-role" id="pvRole">Web Developer &amp; Digital Creator</div>
          <div class="p-bio" id="pvBio"></div>
          <div class="p-links" id="pvLinks"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const IS_EN = new URLSearchParams(location.search).get('lang') === 'en';
    if (IS_EN) {
      document.documentElement.lang = 'en';
      document.getElementById('tHeading').textContent = 'BioCard & vCard (.vcf) Generator';
      document.getElementById('tBack').textContent = 'Back to Free Tools';
      document.getElementById('tBack').href = '../?lang=en';
      document.getElementById('lName').textContent = 'Full Name / Brand';
      document.getElementById('lRole').textContent = 'Title / Tagline';
      document.getElementById('lBio').textContent = 'Short Bio';
      document.getElementById('lColor').textContent = 'Accent Color';
      document.getElementById('lLinks').textContent = 'Links (Format: Label | URL per line)';
      document.getElementById('tBtnVcf').textContent = 'Download vCard (.vcf)';
      document.getElementById('tBtnHtml').textContent = 'Export Standalone Bio (.html)';
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function safeUrl(u) {
      const s = String(u || '').trim();
      return /^(https?:\/\/|mailto:)/i.test(s) ? s : '#';
    }
    function safeColor(c) {
      const s = String(c || '').trim();
      return /^(#[0-9a-f]{3}|#[0-9a-f]{6})$/i.test(s) ? s : '#4f46e5';
    }
    function getData() {
      const links = document.getElementById('inLinks').value.split(/\r?\n/).map((line) => {
        const parts = line.split('|');
        return { label: (parts[0] || '').trim(), url: safeUrl(parts[1] || '') };
      }).filter((x) => x.label && x.url !== '#');
      return {
        name: document.getElementById('inName').value.trim() || 'Creator',
        role: document.getElementById('inRole').value.trim(),
        bio: document.getElementById('inBio').value.trim(),
        email: document.getElementById('inEmail').value.trim(),
        color: safeColor(document.getElementById('inColor').value),
        links
      };
    }
    function render() {
      const d = getData();
      const initials = d.name.split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || 'DS';
      const av = document.getElementById('pvAvatar');
      av.textContent = initials;
      av.style.background = d.color;
      document.getElementById('pvName').textContent = d.name;
      document.getElementById('pvRole').textContent = d.role;
      document.getElementById('pvBio').textContent = d.bio;
      document.getElementById('pvLinks').innerHTML = d.links.map((lk) =>
        `<a class="p-link" href="${esc(lk.url)}" target="_blank" rel="noopener"><span>${esc(lk.label)}</span><span style="color:${esc(d.color)};">&#8599;</span></a>`
      ).join('');
    }
    ['inName', 'inRole', 'inBio', 'inEmail', 'inColor', 'inLinks'].forEach((id) => {
      document.getElementById(id).addEventListener('input', render);
    });
    render();

    function downloadText(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('btnVcf').addEventListener('click', () => {
      const d = getData();
      const vcf = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${d.name}`,
        `TITLE:${d.role}`,
        d.email ? `EMAIL;TYPE=INTERNET:${d.email}` : '',
        d.links[0] ? `URL:${d.links[0].url}` : '',
        d.bio ? `NOTE:${d.bio}` : '',
        'END:VCARD'
      ].filter(Boolean).join('\r\n');
      downloadText('contact-card.vcf', vcf, 'text/vcard;charset=utf-8');
      document.getElementById('statusMsg').textContent = IS_EN ? 'Downloaded contact-card.vcf' : 'Berhasil mengunduh contact-card.vcf';
    });

    document.getElementById('btnHtml').addEventListener('click', () => {
      const d = getData();
      const htmlOut = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>${esc(d.name)}</title><style>*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;padding:20px}.card{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:30px 22px;text-align:center}.av{width:76px;height:76px;border-radius:22px;background:${esc(d.color)};color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}h1{font-size:21px}.role{font-size:13px;color:#475569;margin-top:4px;font-weight:600}.bio{font-size:13.5px;color:#64748b;margin:12px 0 18px;line-height:1.55}.links{display:grid;gap:10px}a{display:flex;justify-content:space-between;padding:13px 16px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;text-decoration:none;color:#0f172a;font-weight:700;font-size:14px}a:hover{border-color:${esc(d.color)}}</style></head><body><div class="card"><div class="av">${esc(d.name.slice(0, 2).toUpperCase())}</div><h1>${esc(d.name)}</h1><div class="role">${esc(d.role)}</div><p class="bio">${esc(d.bio)}</p><div class="links">${d.links.map((lk) => `<a href="${esc(lk.url)}" target="_blank" rel="noopener"><span>${esc(lk.label)}</span><span>&#8599;</span></a>`).join('')}</div></div></body></html>`;
      downloadText('my-bio-page.html', htmlOut, 'text/html;charset=utf-8');
      document.getElementById('statusMsg').textContent = IS_EN ? 'Exported standalone my-bio-page.html' : 'Berhasil mengekspor my-bio-page.html';
    });
  </script>
</body>
</html>
