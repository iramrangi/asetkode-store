<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator HPP, Margin &amp; Harga Jual UMKM — Ddev Kit (MIT)</title>
  <!-- MIT License | Copyright (c) 2026 Ddev Kit (https://asetkode-store.pages.dev/free/) -->
  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { background:#f8fafc; color:#0f172a; min-height:100vh; padding:20px; }
    .wrap { max-width:980px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid #e2e8f0; }
    .badge { display:inline-block; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1.1fr 0.9fr; gap:18px; align-items:start; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:20px; }
    .row { display:grid; grid-template-columns:1fr 140px auto; gap:8px; margin-bottom:8px; align-items:center; }
    input { width:100%; padding:9px 11px; border:1px solid #cbd5e1; border-radius:9px; font-size:13.5px; }
    label { display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:5px; margin-top:10px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 13px; border-radius:9px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; font-weight:700; font-size:12.5px; cursor:pointer; text-decoration:none; }
    .btn-primary { background:#4f46e5; border-color:#4f46e5; color:#fff; }
    .kpi { background:#0b1020; color:#fff; border-radius:14px; padding:18px; margin-bottom:12px; }
    .kpi-val { font-size:30px; font-weight:900; font-family:ui-monospace,Consolas,monospace; margin-top:4px; color:#34d399; }
    .stat-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e2e8f0; font-size:13.5px; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="badge">MIT Open Source &bull; UMKM Toolkit</span>
        <h1 style="font-size:20px;margin-top:6px;" id="tHeading">Kalkulator HPP, Biaya Marketplace &amp; Harga Jual</h1>
      </div>
      <a class="btn" href="../" id="tBack">Kembali ke Halaman Gratis</a>
    </div>

    <div class="grid">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:14px;" id="tComp">Komponen Modal / HPP Per Unit</strong>
          <button type="button" class="btn btn-primary" id="btnAdd">+ Tambah Komponen</button>
        </div>
        <div id="compList"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
          <div>
            <label id="lFee">Biaya Admin / Marketplace (%)</label>
            <input type="number" id="inFee" value="8" min="0" max="60" step="0.5" />
          </div>
          <div>
            <label id="lMargin">Target Profit Bersih (% dari Harga)</label>
            <input type="number" id="inMargin" value="25" min="1" max="80" step="1" />
          </div>
        </div>
        <div style="margin-top:12px;">
          <label id="lFixed">Biaya Tetap Bulanan (Sewa / Listrik / Iklan)</label>
          <input type="number" id="inFixed" value="1500000" min="0" step="50000" />
        </div>
      </div>

      <div class="card">
        <div class="kpi">
          <div style="font-size:12px;color:#94a3b8;font-weight:700;" id="lSell">Rekomendasi Harga Jual Ideal</div>
          <div class="kpi-val" id="outSell">Rp 0</div>
        </div>
        <div class="stat-row"><span id="sModal">Total Modal (HPP) / Unit</span><strong id="outHpp">Rp 0</strong></div>
        <div class="stat-row"><span id="sFee">Potongan Admin Marketplace</span><strong id="outFee">Rp 0</strong></div>
        <div class="stat-row"><span id="sProfit">Laba Bersih / Unit Terjual</span><strong id="outProfit" style="color:#059669;">Rp 0</strong></div>
        <div class="stat-row" style="border-bottom:none;"><span id="sBep">Target Impas (Break-Even Point)</span><strong id="outBep">0 unit</strong></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button type="button" class="btn btn-primary" id="btnCsv">Ekspor Laporan (.CSV)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const IS_EN = new URLSearchParams(location.search).get('lang') === 'en';
    const KEY = 'ddev_free_hpp_v1';
    let items = IS_EN
      ? [{ name: 'Raw Material / Stock', cost: 12 }, { name: 'Packaging & Label', cost: 2 }]
      : [{ name: 'Bahan Baku / Produk', cost: 45000 }, { name: 'Kemasan & Bubble Wrap', cost: 4000 }, { name: 'Tenaga Kerja / Packing', cost: 6000 }];
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (Array.isArray(saved) && saved.length) items = saved;
    } catch (e) {}

    if (IS_EN) {
      document.documentElement.lang = 'en';
      document.getElementById('tHeading').textContent = 'COGS, Marketplace Fee & Pricing Calculator';
      document.getElementById('tBack').textContent = 'Back to Free Tools';
      document.getElementById('tBack').href = '../?lang=en';
      document.getElementById('tComp').textContent = 'Unit Cost Components (COGS)';
      document.getElementById('btnAdd').textContent = '+ Add Cost';
      document.getElementById('lFee').textContent = 'Platform / Payment Fee (%)';
      document.getElementById('lMargin').textContent = 'Target Net Margin (% of Price)';
      document.getElementById('lFixed').textContent = 'Monthly Fixed Costs';
      document.getElementById('lSell').textContent = 'Recommended Selling Price';
      document.getElementById('sModal').textContent = 'Total Unit Cost (COGS)';
      document.getElementById('sFee').textContent = 'Platform Fee / Unit';
      document.getElementById('sProfit').textContent = 'Net Profit / Unit';
      document.getElementById('sBep').textContent = 'Break-Even Volume';
      document.getElementById('btnCsv').textContent = 'Export Report (.CSV)';
      document.getElementById('inFixed').value = 500;
    }

    function fmt(n) {
      return IS_EN ? ('$' + Number(n || 0).toFixed(2)) : ('Rp ' + Math.round(n || 0).toLocaleString('id-ID'));
    }
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function calc() {
      const hpp = items.reduce((s, x) => s + (Number(x.cost) || 0), 0);
      const feePct = Math.min(80, Math.max(0, Number(document.getElementById('inFee').value) || 0));
      const marginPct = Math.min(90, Math.max(1, Number(document.getElementById('inMargin').value) || 20));
      const fixed = Math.max(0, Number(document.getElementById('inFixed').value) || 0);
      const denom = Math.max(0.05, 1 - (feePct + marginPct) / 100);
      const sell = hpp / denom;
      const feeAmt = sell * (feePct / 100);
      const profit = sell - hpp - feeAmt;
      const bep = profit > 0 ? Math.ceil(fixed / profit) : 0;
      document.getElementById('outHpp').textContent = fmt(hpp);
      document.getElementById('outSell').textContent = fmt(sell);
      document.getElementById('outFee').textContent = fmt(feeAmt);
      document.getElementById('outProfit').textContent = fmt(profit);
      document.getElementById('outBep').textContent = bep.toLocaleString('en-US') + ' unit';
      return { hpp, sell, feeAmt, profit, bep };
    }
    function renderRows() {
      document.getElementById('compList').innerHTML = items.map((it, i) => `
        <div class="row">
          <input data-i="${i}" data-k="name" value="${esc(it.name)}" />
          <input data-i="${i}" data-k="cost" type="number" min="0" value="${Number(it.cost) || 0}" />
          <button type="button" class="btn" data-del="${i}" style="padding:8px 10px;">&times;</button>
        </div>
      `).join('');
      calc();
    }

    document.getElementById('compList').addEventListener('input', (e) => {
      const i = Number(e.target.getAttribute('data-i'));
      const k = e.target.getAttribute('data-k');
      if (!Number.isInteger(i) || !k) return;
      items[i][k] = k === 'name' ? e.target.value : Number(e.target.value);
      try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (err) {}
      calc();
    });
    document.getElementById('compList').addEventListener('click', (e) => {
      const del = e.target.getAttribute('data-del');
      if (del !== null && items.length > 1) {
        items.splice(Number(del), 1);
        try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (err) {}
        renderRows();
      }
    });
    document.getElementById('btnAdd').addEventListener('click', () => {
      items.push({ name: IS_EN ? 'Extra Material' : 'Biaya Lain', cost: IS_EN ? 1 : 2500 });
      renderRows();
    });
    ['inFee', 'inMargin', 'inFixed'].forEach((id) => document.getElementById(id).addEventListener('input', calc));
    document.getElementById('btnCsv').addEventListener('click', () => {
      const r = calc();
      const lines = [
        'Component,Amount',
        ...items.map((it) => `"${String(it.name).replace(/"/g, '""')}",${it.cost}`),
        `Total COGS,${r.hpp}`,
        `Recommended Price,${r.sell.toFixed(2)}`,
        `Net Profit Per Unit,${r.profit.toFixed(2)}`,
        `Break-Even Units,${r.bep}`
      ].join('\r\n');
      const b = new Blob([lines], { type: 'text/csv;charset=utf-8' });
      const u = URL.createObjectURL(b);
      const a = document.createElement('a'); a.href = u; a.download = 'hpp-margin-report.csv'; a.click();
      URL.revokeObjectURL(u);
    });
    renderRows();
  </script>
</body>
</html>
